services:
  api:
    image: ${API_IMAGE:-alpine:3.21}
    container_name: ${API_CONTAINER_NAME:-app_api}
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./app-api:/app/app-api:ro
    entrypoint: ["/app/app-api"]
    env_file:
      - .env
    ports:
      - "${API_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: ${API_CONTAINER_MEMORY_LIMIT:-400M}

networks:
  default:
    name: ${APP_NETWORK:-app_net}
    external: true
