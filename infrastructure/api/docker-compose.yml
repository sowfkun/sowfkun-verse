services:
  api:
    build:
      context: ../../sowfkun-verse-api
      dockerfile: Dockerfile
    image: ${API_IMAGE:-app-api:latest}
    container_name: ${API_CONTAINER_NAME:-app_api}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: ${API_CONTAINER_MEMORY_LIMIT:-400M}
