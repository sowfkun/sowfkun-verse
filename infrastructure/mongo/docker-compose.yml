services:
  mongo:
    image: mongodb/mongodb-atlas-local:latest
    container_name: ${MONGO_CONTAINER_NAME:-app_mongo}
    hostname: ${MONGO_CONTAINER_HOSTNAME:-app_mongo}
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${MONGO_CONTAINER_MEMORY_LIMIT:-850M}

volumes:
  mongo_data:
  mongo_config:

networks:
  default:
    name: ${APP_NETWORK:-app_net}
    external: true
