services:
  mongo:
    image: mongodb/mongodb-atlas-local:latest
    container_name: sowfkun_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ./data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${MONGO_CONTAINER_MEMORY_LIMIT:-750M}
