apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://mon_loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
    editable: true

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://mon_prometheus:9090
    isDefault: false
    jsonData:
      timeInterval: 15s
    editable: true

  - name: OpenSearch
    type: opensearch
    access: proxy
    url: http://10.20.0.2:9200
    isDefault: false
    jsonData:
      version: 2.11.0
      database: danger_logs*
      timeField: c_at
    editable: true
