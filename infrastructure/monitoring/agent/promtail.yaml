server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://${LOKI_HOST:-10.20.0.2}:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400

scrape_configs:
  # ===========================================================================
  # 1. DOCKER CONTAINERS (Chỉ đúng 3 nhãn: service, server, level)
  # ===========================================================================
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_log_path']
        target_label: '__path__'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'service'
      - target_label: 'server'
        replacement: '${SERVER_NAME:-APP-NODE-02}'

    pipeline_stages:
      - json:
          expressions:
            raw_log: log

      # 1. Bắt câu lệnh chậm (Duration >= 100ms)
      - regex:
          source: raw_log
          expression: '(?i)(?:durationMillis":\s*(?P<duration_ms>\d+)|(?P<duration_text>\d+)ms)'

      # 2. Bắt log level thông thường
      - regex:
          source: raw_log
          expression: '(?i)(?P<level>ERROR|ERR|WARN|WARNING|INFO|DEBUG|FATAL|PANIC)'

      # 3. Hợp nhất slow_query vào level (>= 300ms)
      - template:
          source: level
          template: |
            {{- if .duration_ms -}}
              {{- if ge (int .duration_ms) 300 -}} slow_query {{- else if .level -}} {{ ToLower .level }} {{- else -}} info {{- end -}}
            {{- else if .duration_text -}}
              {{- if ge (int .duration_text) 300 -}} slow_query {{- else if .level -}} {{ ToLower .level }} {{- else -}} info {{- end -}}
            {{- else if .level -}}
              {{ ToLower .level }}
            {{- else -}}
              info
            {{- end -}}

      # 4. CHỈ LƯU ĐÚNG 3 NHÃN DUY NHẤT VÀO LOKI INDEX
      - labels:
          service:
          server:
          level:

      - labeldrop:
          - filename
          - stream
          - job
          - container
          - service_name
          - is_slow_query

      - output:
          source: raw_log

  # ===========================================================================
  # 2. HOST OS AUDIT & SECURITY LOGS (/var/log/auth.log)
  # ===========================================================================
  - job_name: os_auth
    static_configs:
      - targets: [localhost]
        labels:
          service: os_auth
          server: ${SERVER_NAME:-APP-NODE-02}
          level: info
          __path__: /var/log/auth.log
    pipeline_stages:
      - labeldrop:
          - filename
          - job

  # ===========================================================================
  # 3. HOST OS KERNEL & OOM KILLER LOGS (/var/log/kern.log)
  # ===========================================================================
  - job_name: os_kernel
    static_configs:
      - targets: [localhost]
        labels:
          service: os_kernel
          server: ${SERVER_NAME:-APP-NODE-02}
          level: warn
          __path__: /var/log/kern.log
    pipeline_stages:
      - labeldrop:
          - filename
          - job

  # ===========================================================================
  # 4. HOST OS SYSTEM SERVICES LOGS (/var/log/syslog)
  # ===========================================================================
  - job_name: os_syslog
    static_configs:
      - targets: [localhost]
        labels:
          service: os_syslog
          server: ${SERVER_NAME:-APP-NODE-02}
          level: info
          __path__: /var/log/syslog
    pipeline_stages:
      - labeldrop:
          - filename
          - job
