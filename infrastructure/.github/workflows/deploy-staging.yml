name: Deploy Backend API to Staging

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        default: 'api'
        type: choice
        options:
          - api
      clean_cache:
        description: 'Clean Docker build cache before building?'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Deploy Backend API
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Network
        run: |
          if ! docker network ls | grep -q "app_net"; then
            echo "🌐 Creating shared docker network: app_net..."
            docker network create app_net
          fi

      - name: Optional Cache Clean
        if: ${{ inputs.clean_cache == true }}
        run: |
          echo "🧹 Cleaning Docker build cache..."
          docker builder prune -f

      - name: Build and Deploy Backend Container
        run: |
          echo "🚀 Building and restarting API container..."
          if [ -d "infrastructure/api" ]; then
            cd infrastructure/api
          elif [ -d "api" ]; then
            cd api
          fi
          docker compose down || true
          docker compose up -d --build --remove-orphans


      - name: Health Check API Service
        run: |
          echo "🩺 Waiting for API to be healthy..."
          sleep 5
          for i in {1..10}; do
            if curl -s -f http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "✅ Backend API is HEALTHY and responding!"
              exit 0
            fi
            echo "⏳ Attempt $i/10: API is starting, retrying in 3s..."
            sleep 3
          done
          echo "❌ API Health check failed!"
          docker logs --tail 50 app_api
          exit 1

      - name: Cleanup Dangling Images
        if: always()
        run: |
          echo "🧹 Pruning dangling docker images..."
          docker image prune -f
