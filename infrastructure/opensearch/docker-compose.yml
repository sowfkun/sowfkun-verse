services:
  opensearch:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:latest}
    container_name: ${OPENSEARCH_CONTAINER_NAME:-app_opensearch}
    restart: unless-stopped
    environment:
      - cluster.name=${OPENSEARCH_CLUSTER_NAME:-app-opensearch-cluster}
      - node.name=${OPENSEARCH_NODE_NAME:-opensearch-node-1}
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JVM_HEAP:--Xms384m -Xmx384m}"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${OPENSEARCH_CONTAINER_MEMORY_LIMIT:-650M}
